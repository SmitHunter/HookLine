[project]
name = "hookline"
version = "0.1.0"
description = "Turn a long video into short vertical clips."
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer",
    "pydantic>=2",
    "yt-dlp",
    "faster-whisper",
    "av<18",
    "anthropic",
    "rich",
    "opencv-python-headless>=5.0.0.93",
    "scenedetect>=0.7.2",
]

[project.scripts]
hookline = "hookline.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hookline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: slow tests that load real models (deselect with -m 'not integration')"]

[tool.ruff]
line-length = 100

[tool.uv]
# scenedetect hard-depends on opencv-python (GUI build), which clobbers the cv2 package of
# opencv-python-headless when both are installed. Exclude it; headless provides cv2.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
